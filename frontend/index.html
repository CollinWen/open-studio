<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Collin Wen</title>
    <script>
      // Light or dark paper before the first paint, from the pick saved by
      // src/components/ThemeChoice.tsx (same key); "auto" follows the system.
      try {
        var pick = localStorage.getItem("open-studio-theme");
        var dark = pick ? pick === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
