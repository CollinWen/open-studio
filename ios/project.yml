# Project description for XcodeGen. On a Mac, run `xcodegen` in this folder to
# produce OpenStudio.xcodeproj, then open that in Xcode. Edit this file, not the
# generated project. See README.md.

name: OpenStudio

options:
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    # Change these two to your own before the first build.
    DEVELOPMENT_TEAM: ""                       # your Apple team ID (Xcode > Settings > Accounts)
    BASE_BUNDLE_ID: com.yourname.openstudio    # any reverse-domain name you own
    APP_GROUP_ID: group.$(BASE_BUNDLE_ID)      # lets the app and share extension share the keychain
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  # The app you open once to enter the server address and owner token.
  OpenStudio:
    type: application
    platform: iOS
    sources: [OpenStudio, Shared]
    dependencies:
      - target: ShareToStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
    info:
      path: OpenStudio/Info.plist
      properties:
        CFBundleDisplayName: Open Studio
        UILaunchScreen: {}
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppGroupID: $(APP_GROUP_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reaches your Open Studio server on this Wi-Fi network while testing.
    entitlements:
      path: OpenStudio/OpenStudio.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # The "Open Studio" choice in the iOS share sheet.
  ShareToStudio:
    type: app-extension
    platform: iOS
    sources: [ShareToStudio, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).share
    info:
      path: ShareToStudio/Info.plist
      properties:
        CFBundleDisplayName: Open Studio
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf]
        AppGroupID: $(APP_GROUP_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reaches your Open Studio server on this Wi-Fi network while testing.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # When "Open Studio" shows up in the share sheet: a link (any app that shares
            # one: Safari, Instagram, X, YouTube, TikTok, Pinterest, Spotify, Maps), text
            # (a note from Notes, or a link shared as text), or photos and videos
            # (Photos, Files, screenshots).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
    entitlements:
      path: ShareToStudio/ShareToStudio.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
