# fly.toml app configuration file generated for open-studio-api-cw on 2026-10-13T21:44:17-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'open-studio-api-cw'
primary_region = 'ewr'

[build]
[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'studio_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
